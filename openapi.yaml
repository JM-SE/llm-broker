openapi: 3.1.0
info:
  title: LLM Broker API
  version: 0.1.1
  description: |
    Durable single-host inference scheduler. Clients enqueue tasks; exactly
    one inference runs at a time under operator policy. This API never
    accepts backend selection, model names, priorities, or provider
    parameters: workload and capability slugs resolve through operator
    configuration only.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
paths:
  /health:
    get:
      summary: Process liveness
      description: Returns 200 while the API process is alive. No dependency checks.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      summary: Service readiness
      description: |
        Returns 200 only when the service can process tasks reliably
        (database reachable and migrated, worker lease held and fresh).
        503 otherwise.
      responses:
        "200":
          description: Ready to process tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes bounded-label metrics in Prometheus text format.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/tasks:
    post:
      summary: Create a task
      description: |
        Validates, authenticates, and durably persists a task; the worker
        schedules it. Requires an Idempotency-Key header scoped to the
        credential. Optional bounded synchronous wait via
        "Prefer: wait=<seconds>" (0-30): returns the completed response
        only if the task reaches a terminal state within the window;
        otherwise 202 with Location and Retry-After.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
          description: 8-200 printable ASCII characters, unique per credential.
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            pattern: "^wait=[0-9]+$"
          description: Bounded synchronous wait, 0-30 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmission"
      responses:
        "200":
          description: Task reached a terminal state within the wait window; Location identifies the durable task
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "201":
          description: Task accepted
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "202":
          description: Task accepted with wait window elapsed before terminal state
          headers:
            Location:
              required: true
              schema:
                type: string
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooMany"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{task_id}:
    get:
      summary: Get task state
      description: Returns the task lifecycle state. Scoped to the credential.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{task_id}/result:
    get:
      summary: Get task result
      description: |
        Returns the result envelope. status is "pending" while the task is
        not terminal, "succeeded" with the result payload, "failed" with
        the classified error, "cancelled" with no payload, or "expired"
        after retention purge. A failed task carries a stable error class
        and code, never raw provider output.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{task_id}/cancel:
    post:
      summary: Cancel a task
      description: |
        Queued tasks cancel immediately. Running tasks cancel after the
        current inference completes and the output is discarded. Terminal
        tasks are unchanged; canceling a terminal task returns its state
        with a 409.
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Credential valid but not granted the workload/capability
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Task not found for this credential
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Idempotency conflict or terminal-state conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unprocessable:
      description: Valid JSON but contract violation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooMany:
      description: Admission limit reached
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unavailable:
      description: Service cannot process reliably right now
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 200
      pattern: "^[ -~]+$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable error identifier
    TaskSubmission:
      type: object
      additionalProperties: false
      required: [workload, capability, messages, response]
      properties:
        workload:
          $ref: "#/components/schemas/Slug"
        capability:
          $ref: "#/components/schemas/Slug"
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/Message"
        generation:
          $ref: "#/components/schemas/Generation"
        response:
          $ref: "#/components/schemas/ResponseContract"
        trace:
          $ref: "#/components/schemas/TraceMetadata"
    Slug:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$"
      minLength: 1
      maxLength: 64
    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          maxLength: 262144
    Generation:
      type: object
      additionalProperties: false
      description: Normalized generation vocabulary; provider parameters are never accepted.
      properties:
        max_tokens:
          type: integer
          minimum: 1
          maximum: 8192
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        top_k:
          type: integer
          minimum: 1
          maximum: 100
        min_p:
          type: number
          minimum: 0
          maximum: 1
        seed:
          type: integer
        stop:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    ResponseContract:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, json_object, json_schema]
        schema:
          $ref: "#/components/schemas/SchemaContract"
      if:
        properties:
          kind:
            const: json_schema
        required: [kind]
      then:
        required: [schema]
      else:
        not:
          required: [schema]
    SchemaContract:
      type: object
      description: |
        Draft 2020-12 JSON Schema treated as data: bounded to 64 KiB, depth
        16, 256 declared properties per object; remote references are
        rejected. Only present when kind is json_schema.
    TraceMetadata:
      type: object
      description: Explicit, bounded, non-sensitive correlation metadata.
      additionalProperties:
        type: string
        maxLength: 256
      maxProperties: 16
    Task:
      type: object
      additionalProperties: false
      required: [id, workload, capability, status, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        workload:
          $ref: "#/components/schemas/Slug"
        capability:
          $ref: "#/components/schemas/Slug"
        status:
          $ref: "#/components/schemas/TaskState"
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    TaskResult:
      oneOf:
        - $ref: "#/components/schemas/PendingTaskResult"
        - $ref: "#/components/schemas/SucceededTaskResult"
        - $ref: "#/components/schemas/FailedTaskResult"
        - $ref: "#/components/schemas/CancelledTaskResult"
        - $ref: "#/components/schemas/ExpiredTaskResult"
      discriminator:
        propertyName: status
    PendingTaskResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: pending
    SucceededTaskResult:
      type: object
      additionalProperties: false
      required: [status, result]
      properties:
        status:
          const: succeeded
        result:
          $ref: "#/components/schemas/InferenceResult"
    FailedTaskResult:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          const: failed
        error:
          $ref: "#/components/schemas/ClassifiedError"
    CancelledTaskResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: cancelled
    ExpiredTaskResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: expired
    InferenceResult:
      type: object
      additionalProperties: false
      required: [content, finish_reason, usage]
      properties:
        content:
          type: string
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        usage:
          $ref: "#/components/schemas/Usage"
      description: Never contains reasoning content.
    FinishReason:
      type: string
      enum: [stop, length, content_filter, unknown]
    Usage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ClassifiedError:
      type: object
      additionalProperties: false
      required: [class, code, message]
      properties:
        class:
          $ref: "#/components/schemas/ErrorClass"
        code:
          type: string
        message:
          type: string
          description: Sanitized description; never raw provider output.
    ErrorClass:
      type: string
      enum:
        - client_invalid
        - policy_rejected
        - backend_rejected
        - output_invalid
        - transient_unsent
        - transient_safe
        - indeterminate
        - internal
