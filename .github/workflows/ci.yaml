name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: format
        run: diff -u <(echo -n) <(gofmt -d .)
      - name: test
        # -p 1 serializes package test binaries: the PostgreSQL integration
        # harnesses share one disposable database and reset its schema per
        # package, so parallel package execution would race.
        run: go test -race -p 1 ./...
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./cmd/llm-broker
      - name: mod verify
        run: go mod verify
